kotlin.js.yarn=false

# Four backends (JVM, JS, Wasm, one native target) plus Dokka make the daemon's default heap too
# small: it would restart mid-build and lose the incremental state.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# This repository's own version: one number for every published module. A working tree adds
# `-SNAPSHOT` (see the root build script) and the release workflow drops it with
# `-Pkmp.reflect.release=true`. It is not the version of any dependency, so it stays here.
kmp-reflect.version=0.1.0

# Dependency and plugin versions, by contrast, live in `gradle/libs.versions.toml` and are read
# through the generated `libs` accessor. That includes the ktjs-docusaurus triple (plugin, wrapper
# klib and the kit's browser bundle) and the demo shell; a `-SNAPSHOT` one resolves from
# `mavenLocal`, where every working tree publishes it with `./gradlew publishToMavenLocal`.
#
# The included build `gradle/kmp-reflect-gradle-plugin` is a build of its own: a version catalog is
# per build, so its Kotlin and KSP versions are declared in that build's `plugins` block.
