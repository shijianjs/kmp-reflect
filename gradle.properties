kotlin.js.yarn=false

# Four backends (JVM, JS, Wasm, one native target) plus Dokka make the daemon's default heap too
# small: it would restart mid-build and lose the incremental state.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# Browser test suites and the Kotlin daemon can exhaust the default heap on CI runners.
kotlin.daemon.jvmargs=-Xmx3g

# The one version every published module uses. A working tree adds `-SNAPSHOT` (see the root build
# script); the release workflow drops it with `-Pkmp.reflect.release=true`.
kmp-reflect.version=0.1.0

# The ktjs-docusaurus versions the docs site is built with: the Gradle plugin (settings.gradle.kts)
# and the wrapper klib (docs/build.gradle.kts). Both come from that project, but each of its modules
# carries its own revision, so the numbers are independent.
#
# `mavenLocal` in settings.gradle.kts resolves a SNAPSHOT here: a working tree of ktjs-docusaurus
# publishes one with `./gradlew publishToMavenLocal`. Released versions come from Maven Central.
ktjs-docusaurus.version=3.10.2-kt.2-SNAPSHOT
ktjs-docusaurus-gradle-plugin.version=3.10.2-kt.1-SNAPSHOT

# The kit's browser bundle: the `<ktjs-hero>` / `<ktjs-features>` / `<ktjs-next-steps>` elements the
# landing page uses. It ships as a klib resource rather than a Maven artifact of its own, so this is
# resolved by the `@klib` coordinate in `docs/build.gradle.kts`, not by a compile-time dependency.
ktjs-docusaurus-kit.version=0.1.0-SNAPSHOT

# The demo shell (layout, menu, router, i18n). A working tree of `ktjs-dom-kit` publishes this SNAPSHOT
# with `./gradlew publishToMavenLocal`; the release batch replaces it with the released number.
ktjs-demo-kit.version=0.1.0-SNAPSHOT
