<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demo of kmp-reflect: KSP-generated metadata for Kotlin Multiplatform, with dynamic proxies and inlined classpath resources.">
    <title>kmp-reflect demo</title>
    <script src="demo.js" defer></script>
</head>
<body style="margin: 0; background: #0f1115; color: #e5e7eb">

<kmp-demo-page id="demo" class="page"></kmp-demo-page>
</body>
</html>
