<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demo of kmp-reflect: KSP-generated metadata for Kotlin Multiplatform, with dynamic proxies and inlined classpath resources.">
    <title>kmp-reflect demo</title>
    <link rel="icon" href="img/kmp-reflect-logo.png">
    <!-- Lumo's design tokens and the utility classes the shell uses; copied from the npm workspace. -->
    <link rel="stylesheet" href="lumo.css">
    <link rel="stylesheet" href="utility.css">
    <script src="demo.js" defer></script>
</head>
<body>
<!--
  The shell is named here, not created by the script: `main` defines the tag and mounts the menu into
  the element the browser built, so there is exactly one `<ktjs-demo-layout>` on the page.
-->
<ktjs-demo-layout id="demo"></ktjs-demo-layout>
<noscript>This demo is written in Kotlin/JS and needs JavaScript enabled.</noscript>
</body>
</html>
