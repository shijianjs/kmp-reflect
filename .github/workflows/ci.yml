name: CI

on:
  # Pull requests only: a commit that reached the default branch was already verified by the PR run,
  # so a push would just spend the same build again. Run this manually when needed.
  # Both default-branch names are listed because a derived project may use either one; a base branch
  # that is missing here silently skips CI, which also stops the Dependabot auto-merge from firing.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The official Kotlin Multiplatform CI guidance (kotlinlang.org/docs/multiplatform/
# github-actions-for-kmp.html): no daemon, parallel execution and the Gradle build cache. The heap
# cap is explicit because three jobs now compile four backends each, including a native target.
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # The library claims "every backend KSP can generate into", so the point of CI is to build on the
  # host of each backend rather than trust one runner: Linux links linuxX64, macOS links macosArm64,
  # Windows links mingwX64. Each job runs the metadata assertions on its own native target plus
  # JVM/JS/Wasm, which is exactly what `docs/guide/platforms.md` promises. Browser tests are left to
  # the `browser-and-site` job, where Chromium is set up once.
  verify:
    name: Verify on ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: Linux (linuxX64)
          - os: macos-latest
            host: macOS (macosArm64)
          - os: windows-latest
            host: Windows (mingwX64)
    steps:
      - uses: actions/checkout@v7

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      # The Kotlin/Native distribution is a ~500 MB download per host that Gradle does not cache;
      # the key follows the Kotlin version, because the distribution is tied to it.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ matrix.os }}-2.4.21

      # A Dependabot PR carries neither npm lock file, and `build` validates the committed ones
      # before compiling, so each host refreshes both stores itself — the JS one and the Wasm one,
      # since a Maven artifact reaches both through the npm packages it is converted to.
      - name: Refresh npm lock files
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock
        shell: bash

      - name: Build and test the host's targets
        run: ./gradlew build -x :demo:jsBrowserTest --stacktrace
        shell: bash

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # Browser suites and the artifact the Pages workflow publishes. Ubuntu only: Playwright's Chromium
  # and the docs toolchain are set up once here, and the matrix already proved the other hosts.
  browser-and-site:
    name: Browser tests and Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-ubuntu-latest-2.4.21

      - name: Install browser test dependencies
        run: npx --yes playwright install-deps chromium

      - name: Refresh npm lock files
        if: github.actor == 'dependabot[bot]'
        run: ./gradlew kotlinUpgradePackageLock kotlinWasmUpgradePackageLock

      - name: Test the demo page in a browser
        run: ./gradlew :demo:jsBrowserTest :demo:e2eTest --stacktrace

      # Validates the demo bundle, the docs site and the Dokka reference that the Pages workflow
      # deploys.
      - name: Assemble Pages site
        run: ./gradlew pagesSite

      # Both stores travel in one artifact: it is extracted into `kotlin-js-store` again, where
      # `package-lock.json` and `wasm/package-lock.json` are the paths the checkout tracks.
      - name: Upload refreshed npm lock files
        if: github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: npm-lock
          path: |
            kotlin-js-store/package-lock.json
            kotlin-js-store/wasm/package-lock.json

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-web
          path: |
            "**/build/reports/tests/**"
            demo/build/e2e-results/**
          if-no-files-found: ignore
