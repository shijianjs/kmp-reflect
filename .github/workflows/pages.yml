name: Deploy the documentation site

on:
  # Deploying is a manual action (`gh workflow run pages.yml`): a push to main no longer republishes
  # the site, so a docs-only commit does not queue a full docs build. The site stays the documentation,
  # demo and API reference for the branch that is released.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The demo's Kotlin/Native target is declared by host, so dokka and `pagesSite` may compile the
      # linuxX64 metadata on this runner. Cached, that stays cheap.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-2.4.21

      # pagesSite assembles build/pages: the documentation at the root, the demo under /demo/ and
      # Dokka output under /api/.
      - name: Build the Pages site
        run: ./gradlew pagesSite

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
